name: "Test: Workspace"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test-rust:
    name: "Test: Rust"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Setup: Install project tools with Mise"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.10.22"

      - name: "Setup: Restore Rust dependencies and build cache"
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: test

      - name: "Scan: Check Rust formatting"
        run: mise run format:check:rust

      - name: "Scan: Lint Rust with strict Clippy"
        run: mise run lint:rust

      - name: "Test: Run Rust test targets and doctests"
        run: mise run test

  test-tui:
    name: "Test: TUI checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Setup: Install project tools with Mise"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.10.22"

      - name: "Scan: Check TUI types"
        run: mise run typecheck

      - name: "Scan: Check TUI formatting"
        run: mise run format:check:tui

      - name: "Scan: Lint TUI and check imports"
        run: mise run lint:tui

  test-automation:
    name: "Test: Automation checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Setup: Install project tools with Mise"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.10.22"

      - name: "Scan: Validate GitHub workflows and launcher"
        run: mise run lint:automation

      - name: "Scan: Check source files for secrets"
        run: mise run lint:secrets
