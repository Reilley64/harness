name: "Build: Rust workspace"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust:
    name: "Build: Rust release"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Setup: Install project tools with Mise"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: "2026.10.22"

      - name: "Setup: Restore Rust dependencies and build cache"
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: build

      - name: "Build: Compile the release workspace and all targets"
        run: mise run build:release
